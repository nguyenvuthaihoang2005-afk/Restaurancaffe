<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thanh toán - Restaurants Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global-style.css">
  <style> /* Copy style */ </style>
</head>
<body onload="loadPayments()">
<div class="page-header">
  <h2>[Restaurants Cafe]</h2>
  <a href="dashboard.html" class="btn btn-back">
    <i class="fas fa-arrow-left me-1"></i> Quay lại Trang chủ
  </a>
</div>
  <!-- Sidebar (active cho Thanh toán) -->

  <div class="main-content">
    <h2 class="mb-4">Quản lý Thanh toán</h2>

    <div class="card shadow">
      <div class="card-header">
        <h5 class="mb-0">Danh sách Thanh toán</h5>
      </div>
      <div class="card-body">
        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#paymentModal" onclick="prepareAddPayment()">
          + Thêm thanh toán mới
        </button>

        <div class="table-responsive">
          <table class="table table-hover table-striped">
            <thead>
              <tr>
                <th>ID</th>
                <th>ID Hóa đơn</th>
                <th>Phương thức</th>
                <th>Số tiền</th>
                <th>Ngày thanh toán</th>
                <th>Mã giao dịch</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="paymentsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="paymentModalLabel">Thêm thanh toán mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="paymentForm">
            <input type="hidden" id="paymentId">
            <div class="mb-3">
              <label class="form-label">ID Hóa đơn</label>
              <input type="number" class="form-control" id="invoice_id" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Phương thức</label>
              <select class="form-select" id="payment_method" required>
                <option value="cash">Tiền mặt</option>
                <option value="credit_card">Thẻ tín dụng</option>
                <option value="bank_transfer">Chuyển khoản</option>
                <option value="mobile_wallet">Ví điện tử</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Số tiền</label>
              <input type="number" class="form-control" id="amount_paid" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Mã giao dịch</label>
              <input type="text" class="form-control" id="transaction_id">
            </div>
            <div class="mb-3">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="status" required>
                <option value="pending">Chờ xử lý</option>
                <option value="success">Thành công</option>
                <option value="failed">Thất bại</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="button" class="btn btn-primary" onclick="savePayment()">Lưu</button>
        </div>
      </div>
    </div>
  </div>
<
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiUrl = 'http://localhost:3001/api/payments';

    async function loadPayments() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Lỗi kết nối');
        const payments = await response.json();
        const tbody = document.getElementById('paymentsBody');
        tbody.innerHTML = '';

        payments.forEach(pay => {
          const row = `
            <tr>
              <td>${pay.payment_id}</td>
              <td>${pay.invoice_id}</td>
              <td>${pay.payment_method}</td>
              <td>${pay.amount_paid.toLocaleString('vi-VN')} VNĐ</td>
              <td>${new Date(pay.payment_date).toLocaleString('vi-VN')}</td>
              <td>${pay.transaction_id || '-'}</td>
              <td>${pay.status}</td>
              <td>
                <button class="btn btn-sm btn-warning me-1" onclick="prepareEditPayment(${pay.payment_id}, ${pay.invoice_id}, '${pay.payment_method}', ${pay.amount_paid}, '${pay.transaction_id || ''}', '${pay.status}')">Sửa</button>
                <button class="btn btn-sm btn-danger" onclick="deletePayment(${pay.payment_id})">Xóa</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      } catch (err) {
        console.error(err);
        alert('Không thể tải danh sách thanh toán!');
      }
    }

    function prepareAddPayment() {
      document.getElementById('paymentModalLabel').textContent = 'Thêm thanh toán mới';
      document.getElementById('paymentForm').reset();
      document.getElementById('paymentId').value = '';
    }

    function prepareEditPayment(id, invoice_id, payment_method, amount_paid, transaction_id, status) {
      document.getElementById('paymentModalLabel').textContent = 'Sửa thanh toán';
      document.getElementById('paymentId').value = id;
      document.getElementById('invoice_id').value = invoice_id;
      document.getElementById('payment_method').value = payment_method;
      document.getElementById('amount_paid').value = amount_paid;
      document.getElementById('transaction_id').value = transaction_id;
      document.getElementById('status').value = status;
      const modal = new bootstrap.Modal(document.getElementById('paymentModal'));
      modal.show();
    }

    async function savePayment() {
      const id = document.getElementById('paymentId').value;
      const invoice_id = document.getElementById('invoice_id').value;
      const payment_method = document.getElementById('payment_method').value;
      const amount_paid = parseFloat(document.getElementById('amount_paid').value);
      const transaction_id = document.getElementById('transaction_id').value.trim();
      const status = document.getElementById('status').value;

      if (!invoice_id || isNaN(amount_paid) || !payment_method || !status) {
        alert('Vui lòng nhập đầy đủ thông tin!');
        return;
      }

      const data = { invoice_id, payment_method, amount_paid, transaction_id, status };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${apiUrl}/${id}` : apiUrl;
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          alert(id ? 'Cập nhật thành công!' : 'Thêm thành công!');
          bootstrap.Modal.getInstance(document.getElementById('paymentModal')).hide();
          loadPayments();
        } else {
          alert('Lỗi khi lưu!');
        }
      } catch (err) {
        console.error(err);
        alert('Lỗi kết nối!');
      }
    }

    async function deletePayment(id) {
      if (!confirm('Xóa thanh toán này?')) return;
      try {
        const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
        if (response.ok) {
          alert('Xóa thành công!');
          loadPayments();
        } else {
          alert('Lỗi khi xóa!');
        }
      } catch (err) {
        console.error(err);
        alert('Lỗi kết nối!');
      }
    }
  </script>
</body>
</html>
