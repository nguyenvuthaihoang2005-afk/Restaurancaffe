<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý Đặt bàn - Restaurants Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global-style.css">
  <style>
    /* Copy toàn bộ style từ users.html */
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { background-color: #343a40; color: white; height: 100vh; position: fixed; width: 250px; padding-top: 20px; }
    .sidebar a { color: #adb5bd; padding: 15px 20px; display: block; text-decoration: none; }
    .sidebar a:hover, .sidebar a.active { background-color: #495057; color: white; }
    .main-content { margin-left: 250px; padding: 30px; }
    .card-header { background-color: #0d6efd; color: white; }
    table th { background-color: #e9ecef; }
  </style>
</head>
<body onload="loadReservations()">
<div class="page-header">
  <h2>[Restaurants Cafe]</h2>
  <a href="dashboard.html" class="btn btn-back">
    <i class="fas fa-arrow-left me-1"></i> Quay lại Trang chủ
  </a>
</div>
  <!-- Sidebar -->
  <div class="sidebar">
    <h4 class="text-center mb-4">Restaurants Cafe</h4>
    <a href="dashboard.html">Dashboard</a>
    <a href="users.html">Quản lý Người dùng</a>
    <a href="menu.html">Thực đơn</a>
    <a href="tables.html">Bàn</a>
    <a href="reservations.html" class="active bg-primary text-white">Đặt bàn</a>
    <a href="orders.html">Đơn hàng</a>
    <a href="promotions.html">Khuyến mãi</a>
    <a href="invoices.html">Hóa đơn</a>
    <a href="payments.html">Thanh toán</a>
  </div>

  <div class="main-content">
    <h2 class="mb-4">Quản lý Đặt bàn</h2>

    <div class="card shadow">
      <div class="card-header">
        <h5 class="mb-0">Danh sách Đặt bàn</h5>
      </div>
      <div class="card-body">
        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#reservationModal" onclick="prepareAddReservation()">
          + Thêm đặt bàn mới
        </button>

        <div class="table-responsive">
          <table class="table table-hover table-striped">
            <thead>
              <tr>
                <th>ID</th>
                <th>Khách hàng</th>
                <th>Số bàn</th>
                <th>Thời gian</th>
                <th>Số người</th>
                <th>Trạng thái</th>
                <th>Ghi chú</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="reservationsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Thêm/Sửa -->
  <div class="modal fade" id="reservationModal" tabindex="-1" aria-labelledby="reservationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="reservationModalLabel">Thêm đặt bàn mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="reservationForm">
            <input type="hidden" id="reservationId">
            <div class="mb-3">
              <label class="form-label">ID Khách hàng</label>
              <input type="number" class="form-control" id="user_id" required>
            </div>
            <div class="mb-3">
              <label class="form-label">ID Bàn</label>
              <input type="number" class="form-control" id="table_id" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Thời gian đặt</label>
              <input type="datetime-local" class="form-control" id="reservation_time" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Số người</label>
              <input type="number" class="form-control" id="number_of_guests" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="status" required>
                <option value="pending">Chờ xác nhận</option>
                <option value="confirmed">Đã xác nhận</option>
                <option value="cancelled">Đã hủy</option>
                <option value="completed">Hoàn thành</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Ghi chú</label>
              <textarea class="form-control" id="notes"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="button" class="btn btn-primary" onclick="saveReservation()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiUrl = 'http://localhost:3001/api/reservations';

    async function loadReservations() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Lỗi kết nối');
        const reservations = await response.json();
        const tbody = document.getElementById('reservationsBody');
        tbody.innerHTML = '';

        reservations.forEach(res => {
          const row = `
            <tr>
              <td>${res.reservation_id}</td>
              <td>${res.user_name || 'N/A'}</td>
              <td>${res.table_number || 'N/A'}</td>
              <td>${new Date(res.reservation_time).toLocaleString('vi-VN')}</td>
              <td>${res.number_of_guests}</td>
              <td>${res.status}</td>
              <td>${res.notes || '-'}</td>
              <td>
                <button class="btn btn-sm btn-warning me-1" onclick="prepareEditReservation(${res.reservation_id}, ${res.user_id}, ${res.table_id}, '${res.reservation_time.slice(0,16)}', ${res.number_of_guests}, '${res.status}', '${res.notes || ''}')">Sửa</button>
                <button class="btn btn-sm btn-danger" onclick="deleteReservation(${res.reservation_id})">Xóa</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      } catch (err) {
        console.error(err);
        alert('Không thể tải danh sách đặt bàn!');
      }
    }

    function prepareAddReservation() {
      document.getElementById('reservationModalLabel').textContent = 'Thêm đặt bàn mới';
      document.getElementById('reservationForm').reset();
      document.getElementById('reservationId').value = '';
    }

    function prepareEditReservation(id, user_id, table_id, reservation_time, number_of_guests, status, notes) {
      document.getElementById('reservationModalLabel').textContent = 'Sửa đặt bàn';
      document.getElementById('reservationId').value = id;
      document.getElementById('user_id').value = user_id;
      document.getElementById('table_id').value = table_id;
      document.getElementById('reservation_time').value = reservation_time;
      document.getElementById('number_of_guests').value = number_of_guests;
      document.getElementById('status').value = status;
      document.getElementById('notes').value = notes;
      const modal = new bootstrap.Modal(document.getElementById('reservationModal'));
      modal.show();
    }

    async function saveReservation() {
      const id = document.getElementById('reservationId').value;
      const user_id = document.getElementById('user_id').value;
      const table_id = document.getElementById('table_id').value;
      const reservation_time = document.getElementById('reservation_time').value;
      const number_of_guests = document.getElementById('number_of_guests').value;
      const status = document.getElementById('status').value;
      const notes = document.getElementById('notes').value;

      if (!user_id || !table_id || !reservation_time || !number_of_guests || !status) {
        alert('Vui lòng nhập đầy đủ thông tin!');
        return;
      }

      const data = { user_id, table_id, reservation_time, number_of_guests, status, notes };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${apiUrl}/${id}` : apiUrl;
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          alert(id ? 'Cập nhật thành công!' : 'Thêm thành công!');
          bootstrap.Modal.getInstance(document.getElementById('reservationModal')).hide();
          loadReservations();
        } else {
          alert('Lỗi khi lưu!');
        }
      } catch (err) {
        console.error(err);
        alert('Lỗi kết nối!');
      }
    }

    async function deleteReservation(id) {
      if (!confirm('Xóa đặt bàn này?')) return;
      try {
        const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
        if (response.ok) {
          alert('Xóa thành công!');
          loadReservations();
        } else {
          alert('Lỗi khi xóa!');
        }
      } catch (err) {
        console.error(err);
        alert('Lỗi kết nối!');
      }
    }
  </script>
</body>
</html>
