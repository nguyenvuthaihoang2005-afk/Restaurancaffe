<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập - Restaurants Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/global-style.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .login-wrapper {
      width: 100%;
      max-width: 600px;
      padding: 2.5rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.2);
      animation: fadeIn 0.8s ease-out;
    }
    .role-selection {
      display: flex;
      justify-content: center;
      gap: 4rem;
      margin-bottom: 2rem;
    }
    .role-card {
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 1.5rem;
      border-radius: 15px;
      background: rgba(255,255,255,0.6);
      width: 140px;
    }
    .role-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      background: rgba(255,255,255,0.9);
    }
    .role-card.active {
      border: 3px solid #d4a373;
      background: white;
    }
    .role-card i {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      color: #8b5e3c;
    }
    .role-card h5 {
      font-family: 'Playfair Display', serif;
      color: #8b5e3c;
      margin: 0;
    }
    .login-form {
      display: none;
      animation: fadeInForm 0.5s ease-out;
    }
    .login-form.active {
      display: block;
    }
    .form-label {
      font-weight: 600;
      color: #4b5563;
    }
    .input-group-text {
      cursor: pointer;
      background: #f8f1e9;
      border: 1px solid #d4a373;
    }
    .btn-login {
      background: linear-gradient(90deg, #d4a373, #c68e5f);
      border: none;
      padding: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .btn-login:hover {
      background: linear-gradient(90deg, #e6b980, #d4a373);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(212, 163, 115, 0.35);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInForm {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @media (max-width: 576px) {
      .role-selection {
        flex-direction: column;
        gap: 1.5rem;
      }
      .role-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-header text-center mb-4">
      <h2 style="font-family: 'Playfair Display', serif; color: #8b5e3c;">Restaurants Cafe</h2>
      <p class="text-muted">Chọn vai trò để đăng nhập</p>
    </div>

    <!-- Chọn vai trò bằng icon -->
    <div class="role-selection">
      <div class="role-card" id="customerRole" onclick="selectRole('customer')">
        <i class="fas fa-user"></i>
        <h5>Khách hàng</h5>
      </div>
      <div class="role-card" id="adminRole" onclick="selectRole('admin')">
        <i class="fas fa-user-shield"></i>
        <h5>Admin</h5>
      </div>
    </div>

    <!-- Form Khách hàng -->
    <div id="customerForm" class="login-form">
      <form id="customerLoginForm">
        <div class="mb-3">
          <label for="customerPhone" class="form-label">Số điện thoại / Email</label>
          <input type="text" class="form-control" id="customerPhone" placeholder="Ví dụ: 0909123456 hoặc email@gmail.com" required>
        </div>
        <div class="mb-3">
          <label for="customerPassword" class="form-label">Mật khẩu</label>
          <div class="input-group">
            <input type="password" class="form-control" id="customerPassword" required>
            <span class="input-group-text" onclick="togglePassword('customerPassword', 'customerEye')">
              <i class="fas fa-eye" id="customerEye"></i>
            </span>
          </div>
        </div>
        <button type="submit" class="btn btn-login w-100">Đăng nhập Khách hàng</button>
      </form>
    </div>

    <!-- Form Admin -->
    <div id="adminForm" class="login-form">
      <form id="adminLoginForm">
        <div class="mb-3">
          <label for="adminUsername" class="form-label">Tên đăng nhập</label>
          <input type="text" class="form-control" id="adminUsername" placeholder="admin" required>
        </div>
        <div class="mb-3">
          <label for="adminPassword" class="form-label">Mật khẩu</label>
          <div class="input-group">
            <input type="password" class="form-control" id="adminPassword" required>
            <span class="input-group-text" onclick="togglePassword('adminPassword', 'adminEye')">
              <i class="fas fa-eye" id="adminEye"></i>
            </span>
          </div>
        </div>
        <button type="submit" class="btn btn-login w-100">Đăng nhập Admin</button>
      </form>
    </div>

    <div class="text-center mt-4">
      <small class="text-muted">© 2026 Restaurants Cafe - All rights reserved</small>
    </div>
  </div>

  <script>
    // Toggle hiện/ẩn mật khẩu
    function togglePassword(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
    }

    // Chọn vai trò và hiển thị form tương ứng
    function selectRole(role) {
      // Reset tất cả
      document.querySelectorAll('.role-card').forEach(card => card.classList.remove('active'));
      document.getElementById('customerForm').classList.remove('active');
      document.getElementById('adminForm').classList.remove('active');

      // Active role được chọn
      document.getElementById(role + 'Role').classList.add('active');
      document.getElementById(role + 'Form').classList.add('active');
    }

    // Xử lý form Khách hàng
document.getElementById('customerLoginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  // ... kiểm tra thông tin (demo)
  alert('Đăng nhập khách hàng thành công!');
  window.location.href = 'menu-public.html'; // Chuyển đến menu dành cho khách
});

// Xử lý form Admin
document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const username = document.getElementById('adminUsername').value.trim();
  const password = document.getElementById('adminPassword').value.trim();

  if (username === 'admin' && password === '123') {
    localStorage.setItem('isAdmin', 'true');
    alert('Đăng nhập Admin thành công!');
    window.location.href = 'dashboard.html'; // Trang quản trị cho Admin
  } else {
    alert('Tên đăng nhập hoặc mật khẩu Admin sai!');
  }
});

    // Mặc định chọn Khách hàng khi mở trang
    selectRole('customer');
  </script>
</body>
</html>
