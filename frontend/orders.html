<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đơn hàng - Restaurants Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global-style.css">
  <style> /* Copy from users.html */ </style>
</head>
<body onload="loadOrders()">
<div class="page-header">
  <h2>[Restaurants Cafe]</h2>
  <a href="dashboard.html" class="btn btn-back">
    <i class="fas fa-arrow-left me-1"></i> Quay lại Trang chủ
  </a>
</div>
  <!-- Sidebar (copy from users.html, active for Đơn hàng) -->

  <div class="main-content">
    <h2 class="mb-4">Đơn hàng</h2>

    <div class="card shadow">
      <div class="card-header">
        <h5 class="mb-0">Danh sách Đơn hàng</h5>
      </div>
      <div class="card-body">
        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#orderModal" onclick="prepareAddOrder()">
          + Thêm đơn hàng mới
        </button>

        <div class="table-responsive">
          <table class="table table-hover table-striped">
            <thead>
              <tr>
                <th>ID</th>
                <th>Khách hàng</th>
                <th>Bàn</th>
                <th>Thời gian</th>
                <th>Tổng tiền</th>
                <th>Giảm giá</th>
                <th>Thành tiền</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Thêm/Sửa đơn hàng -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalLabel">Thêm đơn hàng mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="orderForm">
            <input type="hidden" id="orderId">
            <div class="mb-3">
              <label class="form-label">ID Khách hàng</label>
              <input type="number" class="form-control" id="user_id" required>
            </div>
            <div class="mb-3">
              <label class="form-label">ID Bàn</label>
              <input type="number" class="form-control" id="table_id">
            </div>
            <div class="mb-3">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" id="status" required>
                <option value="pending">Chờ</option>
                <option value="preparing">Đang chuẩn bị</option>
                <option value="served">Đã phục vụ</option>
                <option value="completed">Hoàn thành</option>
                <option value="cancelled">Hủy</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Giảm giá</label>
              <input type="number" class="form-control" id="discount_amount">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button type="button" class="btn btn-primary" onclick="saveOrder()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiUrl = 'http://localhost:3001/api/orders';

    async function loadOrders() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Lỗi kết nối API');
        const orders = await response.json();
        const tbody = document.getElementById('ordersBody');
        tbody.innerHTML = '';

        orders.forEach(order => {
          const row = `
            <tr>
              <td>${order.order_id}</td>
              <td>${order.user_name || 'N/A'}</td>
              <td>${order.table_number || 'Mang về'}</td>
              <td>${new Date(order.order_time).toLocaleString('vi-VN')}</td>
              <td>${order.total_amount.toLocaleString('vi-VN')} VNĐ</td>
              <td>${order.discount_amount.toLocaleString('vi-VN')} VNĐ</td>
              <td>${order.final_amount.toLocaleString('vi-VN')} VNĐ</td>
              <td>${order.status}</td>
              <td>
                <button class="btn btn-sm btn-warning me-1" onclick="prepareEditOrder(${order.order_id}, ${order.user_id}, ${order.table_id || null}, '${order.status}', ${order.discount_amount})">Sửa</button>
                <button class="btn btn-sm btn-danger" onclick="deleteOrder(${order.order_id})">Xóa</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      } catch (error) {
        console.error(error);
        alert('Không thể tải đơn hàng!');
      }
    }

    function prepareAddOrder() {
      document.getElementById('orderModalLabel').textContent = 'Thêm đơn hàng mới';
      document.getElementById('orderForm').reset();
      document.getElementById('orderId').value = '';
    }

    function prepareEditOrder(id, user_id, table_id, status, discount_amount) {
      document.getElementById('orderModalLabel').textContent = 'Sửa đơn hàng';
      document.getElementById('orderId').value = id;
      document.getElementById('user_id').value = user_id;
      document.getElementById('table_id').value = table_id || '';
      document.getElementById('status').value = status;
      document.getElementById('discount_amount').value = discount_amount;
      const modal = new bootstrap.Modal(document.getElementById('orderModal'));
      modal.show();
    }

    async function saveOrder() {
      const id = document.getElementById('orderId').value;
      const user_id = document.getElementById('user_id').value;
      const table_id = document.getElementById('table_id').value || null;
      const status = document.getElementById('status').value;
      const discount_amount = parseFloat(document.getElementById('discount_amount').value) || 0;

      if (!user_id || !status) {
        alert('Vui lòng nhập ID khách hàng và trạng thái!');
        return;
      }

      const data = { user_id, table_id, status, discount_amount };

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${apiUrl}/${id}` : apiUrl;
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          alert(id ? 'Cập nhật thành công!' : 'Thêm thành công!');
          bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
          loadOrders();
        } else {
          alert('Lỗi khi lưu!');
        }
      } catch (error) {
        console.error(error);
        alert('Lỗi kết nối!');
      }
    }

    async function deleteOrder(id) {
      if (!confirm('Xóa đơn hàng này?')) return;
      try {
        const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
        if (response.ok) {
          alert('Xóa thành công!');
          loadOrders();
        } else {
          alert('Lỗi khi xóa!');
        }
      } catch (error) {
        console.error(error);
        alert('Lỗi kết nối!');
      }
    }
  </script>
</body>
</html>
